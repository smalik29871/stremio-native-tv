# Cuelight's key relay. The keys are secrets set with `npx wrangler secret put NAME` (README.md);
# none of them belongs in this file.
name = "cuelight-k"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
keep_vars = true   # a deploy keeps settings made in the dashboard (secrets are always kept)

# Cloudflare's own per-address limit, shared by every copy of the relay (free on all plans).
# Without it each copy keeps its own count, which still stops a single runaway device.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Storage for IMDb ids, glow colours and play verdicts: the KV namespace bound as IDS (its id is
# under Storage & Databases > KV in the dashboard). A deploy without it would unbind it, so the
# deploy workflow stops while this is still the placeholder.
[[kv_namespaces]]
binding = "IDS"
id = "3231480d695c4275a0115c3034407ab6"

# Cue Party rooms (src/party.js), one Durable Object per party (SQLite-backed: the free plan's kind).
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
