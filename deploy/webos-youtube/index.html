<!doctype html>
<!-- Cuelight's YouTube player: YouTube's own TV client, opened on the video Cuelight asks for.
     Cuelight launches it with {"v": id, "t": seconds, "mode": "play" | "loop" | "break"} when
     YouTube refuses its own player; webOSUserScripts/userScript.js runs inside YouTube's page. -->
<meta charset="utf-8">
<title>Cuelight YouTube</title>
<style>html, body { margin: 0; background: #000; }</style>
<script>
  var p = {};
  try { p = JSON.parse((window.PalmSystem && window.PalmSystem.launchParams) || "{}") || {}; } catch (e) { p = {}; }
  var v = /^[A-Za-z0-9_-]{6,20}$/.test(p.v || "") ? p.v : "";
  var t = Math.max(0, parseInt(p.t, 10) || 0);
  location.replace("https://www.youtube.com/tv" + (v ? "#/watch?v=" + v + (t ? "&t=" + t + "s" : "") : ""));
</script>
