// Cuelight for Android TV / Google TV / Fire TV (docs/ANDROID_TV.md). The C app is built
// from the repository's CMakeLists.txt with SNTV_PLATFORM=android; SDL2 (fetched by
// tools/android-deps.sh) supplies the activity. The version is the webOS one, so both
// platforms always ship the same release.
plugins { id "com.android.application" }

def repo = file("../../..")
// -PquestVr: the Quest build (docs/VR-PLAN.md), its own app next to the normal one: the screens on a panel in a headset, through OpenXR
def questVr = project.hasProperty("questVr")
// the Quest build is made again and again at one version: -PquestBuild=N (the CI run) makes each a newer version of the one before, so the app can update itself
def questBuild = project.hasProperty("questBuild") ? (project.property("questBuild") as int) : 0
def version = new groovy.json.JsonSlurper().parse(new File(repo, "deploy/webos/appinfo.json")).version
def parts = version.tokenize(".").collect { it as int }

android {
    namespace "app.cuelight.tv"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId questVr ? "app.cuelight.vr" : "app.cuelight.tv"
        manifestPlaceholders = [appLabel: questVr ? "Cuelight VR" : "Cuelight",
                                vrCategory: questVr ? "org.khronos.openxr.intent.category.IMMERSIVE_HMD" : "android.intent.category.DEFAULT",
                                vrCategory2: questVr ? "com.oculus.intent.category.VR" : "android.intent.category.DEFAULT",
                                glEs: questVr ? "0x00030002" : "0x00020000",
                                headtrackingRequired: questVr ? "true" : "false",
                                supportedDevices: questVr ? "quest2|questpro|quest3|quest3s" : "quest|quest2|questpro|quest3|quest3s",
                                orientation: questVr ? "landscape" : "sensorLandscape",
                                launchMode: questVr ? "singleTask" : "singleInstance",
                                pip: questVr ? "false" : "true",
                                resizeable: questVr ? "false" : "true"]
        minSdk questVr ? 29 : 24
        targetSdk questVr ? 34 : 35   /* Quest's immersive apps are supported up to Android 14 (API 34) */
        testInstrumentationRunner "app.cuelight.tv.MobileInstrumentation"
        versionName questVr && questBuild > 0 ? version + "." + questBuild : version
        versionCode questVr ? (parts[0] * 1000000 + parts[1] * 1000 + parts[2]) * 1000 + questBuild : parts[0] * 1000000 + parts[1] * 1000 + parts[2]
        ndk { abiFilters(*(questVr ? ["arm64-v8a"] : ["arm64-v8a", "armeabi-v7a"])) }
        externalNativeBuild {
            cmake {
                arguments "-DSNTV_PLATFORM=android", "-DSNTV_BUILD_TESTS=OFF", "-DANDROID_STL=c++_shared", "-DSNTV_VR=" + (questVr ? "ON" : "OFF"), "-DSNTV_VR_BUILD=" + questBuild,
                          "-DSNTV_TMDB_BUILTIN_KEY=" + (System.getenv("TMDB_API_KEY") ?: ""),
                          "-DSNTV_OPENSUBTITLES_KEY=" + (System.getenv("OPENSUBTITLES_KEY") ?: ""),
                          "-DSNTV_TRAKT_CLIENT_ID=" + (System.getenv("TRAKT_CLIENT_ID") ?: ""),
                          "-DSNTV_TRAKT_CLIENT_SECRET=" + (System.getenv("TRAKT_CLIENT_SECRET") ?: ""),
                          "-DSNTV_SIMKL_CLIENT_ID=" + (System.getenv("SIMKL_CLIENT_ID") ?: ""),
                          "-DSNTV_MDBLIST_KEY=" + (System.getenv("MDBLIST_KEY") ?: "")
            }
        }
    }
    externalNativeBuild {
        cmake { path new File(repo, "CMakeLists.txt") }
    }
    sourceSets {
        main {
            java.srcDirs += "../third_party/SDL2/android-project/app/src/main/java"
            assets.srcDirs = [new File(repo, "assets")]
        }
    }
    signingConfigs {
        release {   // CI: the release key from repository secrets; without them the build is debug-signed
            def ks = System.getenv("ANDROID_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("ANDROID_KEY_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "cuelight"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("ANDROID_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
        }
    }
    buildFeatures { buildConfig true; prefab questVr }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    packagingOptions { jniLibs { useLegacyPackaging true } }   // libraries unpacked on install: the P2P engine runs from there
}

dependencies {   // the video player (CuelightPlayer.java)
    def media3 = "1.4.1"
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.core:core:1.13.1"   // FileProvider: the downloaded update handed to the installer
    implementation "com.pierfrancescosoffritti.androidyoutubeplayer:core:13.0.0"   // YouTube's own player (MIT), where YouTube refuses ours
    if (questVr) implementation "org.khronos.openxr:openxr_loader_for_android:1.1.54"   // the OpenXR loader and headers (Khronos, Apache-2.0)
}
