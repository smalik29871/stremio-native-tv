# Deploys the key relay (relay/: keys, glow, verdicts and Cue Party rooms) to Cloudflare when it
# changes on main, after its tests pass; or by hand (Actions > Relay > Run workflow).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (the "Edit Cloudflare Workers" template)
# and CLOUDFLARE_ACCOUNT_ID. The relay's own secrets (MDBLIST_KEY and the rest) stay in
# Cloudflare: a deploy keeps them.
name: Relay

on:
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/relay.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: The KV namespace is set
        # deploying without it would unbind the relay's storage
        run: |
          grep -Eq '^id = "[0-9a-f]{32}"' wrangler.toml || { echo "::error::wrangler.toml still has no IDS namespace id"; exit 1; }
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
