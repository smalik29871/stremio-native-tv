# Makes a beta the release everyone gets: run it by hand (Actions > Promote > Run workflow)
# once it has been used on the beta devices. Left empty, the version is the newest beta (the
# run's summary lists the recent ones); or name an earlier one. The pre-release becomes the
# latest release, so .../releases/latest/download/... (every device's update check and the
# Homebrew Channel) moves to it, and the releases repository's README follows.
name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The beta to give everyone, e.g. 0.10.87 (empty: the newest beta)"
        required: false
        default: ""

permissions:
  contents: read

env:
  RELEASES_REPO: smalik29871/cuelight-releases

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Which beta
        id: pick
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          # the versioned pre-releases, newest first (not the rolling "beta" one the update check reads)
          gh release list --repo "$RELEASES_REPO" --limit 40 --json tagName,name,isPrerelease,isLatest,publishedAt \
            --jq '.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | [.tagName, (if .isPrerelease then "beta" elif .isLatest then "everyone (latest)" else "released" end), .publishedAt[0:16], (if (.name | test("\\((tv|mobile|desktop)( \\+ (tv|mobile|desktop))*( beta)?\\)$")) then (.name | capture("\\((?<k>[a-z +]+?)(?: beta)?\\)$").k) else "all devices" end)] | @tsv' > releases.tsv
          if [ -n "$VERSION" ]; then
            TAG="v${VERSION#v}"
          else
            TAG="$(awk -F'\t' '$2 == "beta" { print $1; exit }' releases.tsv)"
            [ -n "$TAG" ] || { echo "::error::no beta waiting to be promoted in $RELEASES_REPO"; exit 1; }
          fi
          {
            echo "### Promoting $TAG"
            echo
            echo "| Version | Now | Published (UTC) | For |"
            echo "|---|---|---|---|"
            head -10 releases.tsv | awk -F'\t' '{ printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4 }'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Make it the latest release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "::error::$TAG is not in $RELEASES_REPO"; exit 1
          fi
          NAME="$(gh release view "$TAG" --repo "$RELEASES_REPO" --json name --jq .name)"
          # a release for some families only is titled "Cuelight vX (tv beta)", "(mobile beta)", "(desktop beta)", "(tv + mobile beta)"
          LABEL="$(printf '%s' "$NAME" | sed -nE 's/^.*\(((tv|mobile|desktop)( \+ (tv|mobile|desktop))*)( beta)?\)$/\1/p')"
          if [ -z "$LABEL" ]; then
            gh release edit "$TAG" --repo "$RELEASES_REPO" --prerelease=false --latest --title "Cuelight $TAG"
            echo "$TAG is the latest release"
            echo "partial=false" >> "$GITHUB_OUTPUT"
          else
            # A release for some families has only their files: "latest" (one whole release, where every TV, phone and
            # computer looks) must not move to it. It is marked released, and its update files go into the release that
            # is latest, which is where each device reads them: the other families stay as they are. (Every address in
            # them is to this version's own files.)
            gh release edit "$TAG" --repo "$RELEASES_REPO" --prerelease=false --latest=false --title "Cuelight $TAG ($LABEL)"
            LATEST="$(gh release view --repo "$RELEASES_REPO" --json tagName --jq .tagName)"
            mkdir -p upd
            for F in repo.json android.json mobile.json windows.json; do
              gh release download "$TAG" --repo "$RELEASES_REPO" --pattern "$F" --dir upd 2>/dev/null || true
            done
            ls upd/*.json >/dev/null 2>&1 || { echo "::error::$TAG has no update file to hand on"; exit 1; }
            gh release upload "$LATEST" upd/*.json --repo "$RELEASES_REPO" --clobber
            echo "$TAG is the $LABEL release: those devices get it (through $LATEST's update files); the others stay on $LATEST"
            echo "partial=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh the README in the public repository
        if: steps.latest.outputs.partial != 'true'   # the README names the release everyone gets: one for some families is not it
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${RELEASES_REPO}.git" pub
          sed -e "s|\${TAG}|${TAG}|g" -e "s|\${RELEASES_REPO}|${RELEASES_REPO}|g" deploy/releases/README.md > pub/README.md
          cp LICENSE THIRD-PARTY-NOTICES.md pub/
          cd pub
          git add README.md LICENSE THIRD-PARTY-NOTICES.md
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "README, licence and notices for ${TAG}"
            git push -q origin HEAD
          fi
