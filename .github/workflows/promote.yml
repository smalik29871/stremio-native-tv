# Makes a beta the release everyone gets: run it by hand (Actions > Promote > Run workflow)
# once it has been used on the beta devices. Left empty, the version is the newest beta (the
# run's summary lists the recent ones); or name an earlier one. The pre-release becomes the
# latest release, so .../releases/latest/download/... (every device's update check and the
# Homebrew Channel) moves to it, and the releases repository's README follows.
name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The beta to give everyone, e.g. 0.10.87 (empty: the newest beta)"
        required: false
        default: ""

permissions:
  contents: read

env:
  RELEASES_REPO: smalik29871/cuelight-releases

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Which beta
        id: pick
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          # the versioned pre-releases, newest first (not the rolling "beta" one the update check reads)
          gh release list --repo "$RELEASES_REPO" --limit 40 --json tagName,name,isPrerelease,isLatest,publishedAt \
            --jq '.[] | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | [.tagName, (if .isPrerelease then "beta" elif .isLatest then "everyone (latest)" else "released" end), .publishedAt[0:16], (if (.name | test("mobile")) then "phones and tablets" else "all devices" end)] | @tsv' > releases.tsv
          if [ -n "$VERSION" ]; then
            TAG="v${VERSION#v}"
          else
            TAG="$(awk -F'\t' '$2 == "beta" { print $1; exit }' releases.tsv)"
            [ -n "$TAG" ] || { echo "::error::no beta waiting to be promoted in $RELEASES_REPO"; exit 1; }
          fi
          {
            echo "### Promoting $TAG"
            echo
            echo "| Version | Now | Published (UTC) | For |"
            echo "|---|---|---|---|"
            head -10 releases.tsv | awk -F'\t' '{ printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4 }'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Make it the latest release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "::error::$TAG is not in $RELEASES_REPO"; exit 1
          fi
          if gh release view "$TAG" --repo "$RELEASES_REPO" --json assets --jq '.assets[].name' | grep -qx 'repo.json'; then
            gh release edit "$TAG" --repo "$RELEASES_REPO" --prerelease=false --latest --title "Cuelight $TAG"
            echo "$TAG is the latest release"
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          else
            # A mobile release has no LG or Windows files: "latest" (one whole release, where every TV and computer
            # looks) must not move to it. It is marked released, and its phone update file goes into the release that
            # is latest, which is where phones look: TVs and computers stay as they are.
            gh release edit "$TAG" --repo "$RELEASES_REPO" --prerelease=false --latest=false --title "Cuelight $TAG (mobile)"
            LATEST="$(gh release view --repo "$RELEASES_REPO" --json tagName --jq .tagName)"
            mkdir -p mobile && gh release download "$TAG" --repo "$RELEASES_REPO" --pattern mobile.json --dir mobile
            gh release upload "$LATEST" mobile/mobile.json --repo "$RELEASES_REPO" --clobber
            echo "$TAG is the mobile release: phones get it (through $LATEST's mobile.json); TVs and computers stay on $LATEST"
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Refresh the README in the public repository
        if: steps.latest.outputs.mobile != 'true'   # the README names the release everyone gets: a mobile one is not it
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          git clone -q --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${RELEASES_REPO}.git" pub
          sed -e "s|\${TAG}|${TAG}|g" -e "s|\${RELEASES_REPO}|${RELEASES_REPO}|g" deploy/releases/README.md > pub/README.md
          cp LICENSE THIRD-PARTY-NOTICES.md pub/
          cd pub
          git add README.md LICENSE THIRD-PARTY-NOTICES.md
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "README, licence and notices for ${TAG}"
            git push -q origin HEAD
          fi
