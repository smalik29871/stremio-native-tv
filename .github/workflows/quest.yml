# The Quest build (docs/VR-PLAN.md): Cuelight's screens on a panel in a headset, an APK of its own
# (app.cuelight.vr) to sideload. Built on demand (Actions > Quest APK > Run workflow) and on pushes
# to vr/* branches. Never part of a release.
name: Quest APK
on:
  workflow_dispatch:
  push:
    branches: ["vr/**", "feat/vr-**"]
jobs:
  quest:
    name: Quest APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Android SDK parts
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
      - name: Release key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "have=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "have=true" >> "$GITHUB_OUTPUT"
      - name: Build the APK
        env:
          ANDROID_KEYSTORE: ${{ steps.key.outputs.have == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          MDBLIST_KEY: ${{ secrets.MDBLIST_KEY }}
          OPENSUBTITLES_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: |
          bash tools/android-deps.sh
          cd deploy/android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon -q -PquestVr assembleRelease
          VERSION=$(python3 -c "import json; print(json.load(open('../webos/appinfo.json'))['version'])")
          mkdir -p ../../dist-quest
          cp app/build/outputs/apk/release/app-release.apk "../../dist-quest/cuelight-quest-$VERSION.apk"
          ls -l ../../dist-quest
      - uses: actions/upload-artifact@v4
        with:
          name: cuelight-quest-apk
          path: dist-quest/
          if-no-files-found: error
