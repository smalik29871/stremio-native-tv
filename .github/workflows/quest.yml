# The Quest build (docs/VR-PLAN.md): Cuelight's screens on a panel in a headset, an APK of its own
# (app.cuelight.vr) to sideload once. Built on demand (Actions > Quest APK > Run workflow) and on pushes
# to vr/* branches. Never part of a release: after each build the APK and a small manifest (quest.json)
# are put into the releases repository's fixed "quest" pre-release (never "latest": that is every other
# device's), and the Quest app updates itself from it (Menu > Updates, or the question at a quiet moment).
# Each build is a newer version of the one before: the fourth part of its version is this run's number.
name: Quest APK
on:
  workflow_dispatch:
  push:
    branches: ["vr/**", "feat/vr-**"]
# one at a time, in order: a run that finishes late must not put an older build over a newer one
concurrency:
  group: quest-apk
  cancel-in-progress: false
jobs:
  quest:
    name: Quest APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Android SDK parts
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
      - name: Release key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "have=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "have=true" >> "$GITHUB_OUTPUT"
      - name: Build the APK
        env:
          ANDROID_KEYSTORE: ${{ steps.key.outputs.have == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          MDBLIST_KEY: ${{ secrets.MDBLIST_KEY }}
          OPENSUBTITLES_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: |
          bash tools/android-deps.sh
          cd deploy/android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon -q -PquestVr -PquestBuild=${{ github.run_number }} assembleRelease
          VERSION=$(python3 -c "import json; print(json.load(open('../webos/appinfo.json'))['version'])")
          mkdir -p ../../dist-quest
          cp app/build/outputs/apk/release/app-release.apk "../../dist-quest/cuelight-quest-$VERSION.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk ../../dist-quest/cuelight-quest.apk
          # what the app reads to know there is something newer: {"version", "apkUrl", "sha256"} (the same shape as the Android app's)
          SHA=$(sha256sum ../../dist-quest/cuelight-quest.apk | cut -d' ' -f1)
          python3 - "$VERSION.${{ github.run_number }}" "$SHA" <<'PY'
          import json, sys
          json.dump({"version": sys.argv[1], "apkUrl": "https://github.com/smalik29871/cuelight-releases/releases/download/quest/cuelight-quest.apk", "sha256": sys.argv[2]}, open("../../dist-quest/quest.json", "w"))
          PY
          ls -l ../../dist-quest; cat ../../dist-quest/quest.json
      - uses: actions/upload-artifact@v4
        with:
          name: cuelight-quest-apk
          path: dist-quest/
          if-no-files-found: error
      - name: Put it where the app looks for updates
        if: steps.key.outputs.have == 'true'   # without the release key the APK is debug-signed with a fresh key each run: Android would refuse it as an update
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPO: smalik29871/cuelight-releases
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "No RELEASES_TOKEN here: the build stays an artifact only"; exit 0; fi
          if ! gh release view quest --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release create quest --repo "$RELEASES_REPO" --prerelease --latest=false --title "Cuelight VR (Quest) builds" \
              --notes "The newest Cuelight VR build for the Meta Quest. The app updates itself from here (Menu > Updates). Not a release for any other device."
          fi
          # the APK first, the manifest last: an app that reads the manifest finds the file it names
          gh release upload quest dist-quest/cuelight-quest.apk --repo "$RELEASES_REPO" --clobber
          gh release upload quest dist-quest/quest.json --repo "$RELEASES_REPO" --clobber
