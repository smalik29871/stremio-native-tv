# Builds and tests on every push. A push to main whose deploy/webos/appinfo.json
# version has no release yet (or a pushed v* tag) publishes a release with the LG
# .ipk plus the Homebrew Channel repository files to the public releases repository
# (RELEASES_REPO, written with the RELEASES_TOKEN secret), so TVs subscribed to
# .../releases/latest/download/repo.json get the update; this source repository can
# stay private. While it is still public the release is made here too, so TVs on
# older versions (which look here) find the build that moves them over.
# To ship a new version: bump the version in appinfo.json and push to main, or push it to a
# claude/ branch: once every job is green, main is fast-forwarded to it and it is published.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a run still going there (main's are left to finish:
# one of them may be publishing).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RELEASES_REPO: smalik29871/stremio-custom-lg-tv-releases
  # openlgtv buildroot SDK pinned to the release the Nuvio native client ships with.
  WEBOS_SDK_URL: https://github.com/openlgtv/buildroot-nc4/releases/download/webos-a38c582/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz
  WEBOS_SDK_SHA256: 04ad3311b48b4557a7002aef56ae2e167478e8e129f37daac04649bddf813616

jobs:
  desktop:
    # Actions minutes are counted (private repository) and the full suite runs before every
    # push anyway: an ordinary branch push runs nothing here. Main, tags, a run started by
    # hand and a release commit ("0.10.49") run everything; a release commit saying
    # "[tested here]" (the whole suite passed where it was made) only builds and publishes.
    if: >-
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '0.')) &&
      !contains(github.event.head_commit.message, '[tested here]')
    name: Desktop build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libsdl2-dev libgles-dev libegl-dev libcurl4-openssl-dev nasm
      - name: Cache FFmpeg (seek preview decoder)
        uses: actions/cache@v4
        with:
          path: ffmpeg-host
          key: ffmpeg-host-${{ hashFiles('tools/ffmpeg.sh') }}
      - name: FFmpeg
        run: bash tools/ffmpeg.sh host ffmpeg-host
      - name: Build
        run: |
          cmake -S . -B build -DSNTV_PLATFORM=linux -DCMAKE_BUILD_TYPE=Release -DSNTV_FFMPEG_PREFIX="$PWD/ffmpeg-host"
          cmake --build build -j"$(nproc)"
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - uses: actions/setup-go@v5   # the P2P engine (tools/torrentd)
        with:
          go-version-file: tools/torrentd/go.mod
          cache-dependency-path: tools/torrentd/go.sum
      - name: P2P engine tests
        run: cd tools/torrentd && go vet ./... && go test ./...

  ui:
    # (when, as for the desktop build above)
    if: >-
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '0.')) &&
      !contains(github.event.head_commit.message, '[tested here]')
    # The scripted UI runs (tests/smoke.sh) under Xvfb against the fake addon, in four parts
    # on four machines (tests/shard.py); a release waits for all of them. Each part stops at
    # its first failure; its logs and screenshots are uploaded.
    name: UI scenarios ${{ matrix.part }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false   # every part's result, not only the first failure
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libsdl2-dev libgles-dev libegl-dev libcurl4-openssl-dev nasm \
            xvfb xauth libgl1-mesa-dri libegl-mesa0 python3-pil
      - name: Cache FFmpeg (seek preview decoder)
        uses: actions/cache@v4
        with:
          path: ffmpeg-host
          key: ffmpeg-host-${{ hashFiles('tools/ffmpeg.sh') }}
      - name: FFmpeg
        run: bash tools/ffmpeg.sh host ffmpeg-host
      - name: Build
        run: |
          cmake -S . -B build -DSNTV_PLATFORM=linux -DCMAKE_BUILD_TYPE=Release -DSNTV_FFMPEG_PREFIX="$PWD/ffmpeg-host"
          cmake --build build -j"$(nproc)"
      - name: UI scenarios
        run: bash tests/smoke.sh build
        env:
          SMOKE_PART: ${{ matrix.part }}/4
      - name: Logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-scenarios-${{ matrix.part }}
          path: |
            tests/out/*.log
            tests/out/*.png
          retention-days: 7

  webos:
    if: >-
      github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '0.')
    name: LG webOS package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache webOS toolchain
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/webos-sdk
          key: webos-sdk-${{ env.WEBOS_SDK_SHA256 }}
      - name: Download webOS toolchain
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/webos-sdk
          curl -fsSL --retry 3 "$WEBOS_SDK_URL" -o /tmp/sdk.tar.gz
          echo "$WEBOS_SDK_SHA256  /tmp/sdk.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sdk.tar.gz -C ~/webos-sdk
          rm /tmp/sdk.tar.gz
      - name: Relocate toolchain
        run: ~/webos-sdk/arm-webos-linux-gnueabi_sdk-buildroot/relocate-sdk.sh
      - name: Cache FFmpeg (seek preview decoder)
        uses: actions/cache@v4
        with:
          path: build-webos/ffmpeg
          key: ffmpeg-webos-${{ env.WEBOS_SDK_SHA256 }}-${{ hashFiles('tools/ffmpeg.sh') }}
      - uses: actions/setup-go@v5   # the P2P engine (tools/torrentd)
        with:
          go-version-file: tools/torrentd/go.mod
          cache-dependency-path: tools/torrentd/go.sum
      - name: Build .ipk
        env:
          WEBOS_TOOLCHAIN: /home/runner/webos-sdk/arm-webos-linux-gnueabi_sdk-buildroot
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}   # optional: bakes a TMDB key in (Settings > API keys explains)
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}           # optional: Trakt works without typing an app id
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          MDBLIST_KEY: ${{ secrets.MDBLIST_KEY }}
          OPENSUBTITLES_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
        run: bash tools/webos.sh --ipk
      - name: Check package
        run: |
          IPK=$(ls build-webos/*.ipk)
          bash tools/check-ipk.sh "$IPK" ~/webos-sdk/arm-webos-linux-gnueabi_sdk-buildroot
          bash tools/hb-repo.sh "$IPK" dist
          cp "$IPK" dist/
          cp deploy/webos/largeIcon.png dist/   # the Homebrew Channel icon
      - uses: actions/upload-artifact@v4
        with:
          name: webos-ipk
          path: dist/
          if-no-files-found: error

  promote:
    # A push to a claude/ branch whose appinfo.json version has no release yet, every test
    # green: main is moved up to it (fast-forward only) and the release below is made from
    # this run. A push made with this run's token starts no other run, so it is published once.
    # (The token cannot push commits that change workflow files: such a release goes to main by hand.)
    name: Move main to a tested release
    if: >-
      always() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/') &&
      (needs.desktop.result == 'success' || (needs.desktop.result == 'skipped' && contains(github.event.head_commit.message, '[tested here]'))) &&
      needs.webos.result == 'success' &&
      (needs.ui.result == 'success' || (needs.ui.result == 'skipped' && contains(github.event.head_commit.message, '[tested here]')))
    needs: [desktop, webos, ui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      promoted: ${{ steps.ff.outputs.promoted }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward main
        id: ff
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('deploy/webos/appinfo.json'))['version'])")
          if [ -z "$GH_TOKEN" ] || gh release view "v$VERSION" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "v$VERSION is released already (or the releases token is missing): nothing to move"
            echo "promoted=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch -q origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main has commits this branch does not: merge main in, then push again"; exit 1
          fi
          git push origin HEAD:refs/heads/main
          echo "promoted=true" >> "$GITHUB_OUTPUT"

  release:
    name: Publish release
    if: >-
      always() && github.event_name == 'push' &&
      (needs.desktop.result == 'success' || (needs.desktop.result == 'skipped' && contains(github.event.head_commit.message, '[tested here]'))) &&
      needs.webos.result == 'success' &&
      (needs.ui.result == 'success' || (needs.ui.result == 'skipped' && contains(github.event.head_commit.message, '[tested here]'))) &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || needs.promote.outputs.promoted == 'true')
    needs: [desktop, webos, ui, promote]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # git to the releases repository uses its own token
      - uses: actions/download-artifact@v4
        with:
          name: webos-ipk
          path: dist
      - name: Decide release version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('deploy/webos/appinfo.json'))['version'])")
          TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match appinfo.json version $VERSION"; exit 1
          fi
          if [ -z "$PUBLIC_TOKEN" ]; then echo "The RELEASES_TOKEN secret is missing"; exit 1; fi
          if GH_TOKEN="$PUBLIC_TOKEN" gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists in $RELEASES_REPO."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          # here too while this repository is public (TVs on older versions look here)
          if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = "false" ] && ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "here=true" >> "$GITHUB_OUTPUT"
          else
            echo "here=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG
        if: steps.ver.outputs.publish == 'true' || steps.ver.outputs.here == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          awk -v v="## $VERSION" '$0==v{on=1;next} /^## /{if(on)exit} on' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install on LG webOS"
            echo "In the Homebrew Channel, open Settings, add this repository, and install **Cuelight**:"
            echo
            echo '```'
            echo "https://github.com/${RELEASES_REPO}/releases/latest/download/repo.json"
            echo '```'
          } >> notes.md
          cat notes.md
      - name: Create the release in the public repository
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # a release needs a commit to tag: an empty repository gets a README first
          if [ -z "$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${RELEASES_REPO}.git" 2>/dev/null)" ]; then
            mkdir seed && cd seed && git init -q -b main
            printf '# Cuelight for LG webOS: releases\n\nBuilds of Cuelight, a native player for your Stremio account and addons (not affiliated with Stremio). In the Homebrew Channel, add\n\n    https://github.com/%s/releases/latest/download/repo.json\n' "$RELEASES_REPO" > README.md
            git add README.md
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Releases of Cuelight"
            git push -q "https://x-access-token:${GH_TOKEN}@github.com/${RELEASES_REPO}.git" main
            cd ..
          fi
          gh release create "$TAG" dist/* \
            --repo "$RELEASES_REPO" \
            --title "Cuelight $TAG" \
            --notes-file notes.md
      - name: Create the release here too
        if: steps.ver.outputs.here == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Cuelight $TAG" \
            --notes-file notes.md
